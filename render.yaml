# Render Blueprint for the .NET API (render.com → New → Blueprint → this repo).
# Builds the root Dockerfile. Values marked sync: false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: tickey-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # The container listens on 8080 (ASPNETCORE_URLS in the Dockerfile).
      - key: PORT
        value: "8080"
      - key: Supabase__Url
        value: https://ddourrslmudoqevqlvpv.supabase.co
      # Publishable key (sb_publishable_…).
      - key: Supabase__AnonKey
        sync: false
      # Secret key (sb_secret_…). Backend only.
      - key: Supabase__ServiceRoleKey
        sync: false
      # This service's own https URL, e.g. https://tickey-api.onrender.com (used for payment return links).
      - key: Api__PublicUrl
        sync: false
      # Test mode: fake checkout page instead of a real gateway (no money moves). Remove for real payments.
      - key: Payments__Gateway
        value: TEST
      # Ed25519 seed for QR tickets: the API issues tickets itself when this is set (no separate Workers host).
      - key: Qr__SigningKey
        sync: false
      - key: Qr__Kid
        value: hosted-1
      # The Vercel portal's origin, e.g. https://tickey-portal.vercel.app
      - key: Cors__Origins__0
        sync: false
