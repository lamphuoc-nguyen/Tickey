name: CI

# MT §25.1: lint, typecheck, test, build and pgTAP must be green before merging into main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Apps and packages (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @event/portal build

  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --solution backend/EventPlatform.sln
      # B-32: dotnet test only builds Debug, so a Release-only warning (the solution
      # sets TreatWarningsAsErrors) would reach Render as a failed image build.
      - run: dotnet build --configuration Release backend/EventPlatform.sln

  docker:
    name: API image (Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # B-32: Render builds from this Dockerfile, so CI builds it too. Keep the
      # context at the repo root — .dockerignore is what keeps it small.
      - run: docker build -f Dockerfile -t tickey-api:ci .

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase db start
      - run: supabase test db
