name: Mobile build (EAS)

# Manual Android build on Expo's servers. Actions → "Mobile build (EAS)" → Run workflow.
# Needs the repo secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).
# The finished APK / AAB link appears on expo.dev under the project's Builds.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to build
        type: choice
        options: [customer, staff]
        default: customer
      profile:
        description: preview = installable APK for testers, production = AAB for Google Play
        type: choice
        options: [preview, production, development]
        default: preview

jobs:
  build:
    name: ${{ inputs.app }} · ${{ inputs.profile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Start EAS build
        working-directory: apps/${{ inputs.app }}
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
